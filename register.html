<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - CMC Fitness</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html"><i class="fa-solid fa-house"></i>Home</a></li>
            <li><a href="services.html"><i class="fa-solid fa-dumbbell"></i>Services</a></li>
            <li><a href="register.html" class="active"><i class="fa-solid fa-pen-to-square"></i>Register</a></li>
            <li><a href="programs.html"><i class="fa-solid fa-list-check"></i>Programs</a></li>
            <li><a href="programs.html#weightloss"><i class="fa-solid fa-fire"></i>Weight Loss</a></li>
            <li><a href="programs.html#musclegain"><i class="fa-solid fa-hand-back-fist"></i>Muscle Gain</a></li>
            <li><a href="programs.html#yoga"><i class="fa-solid fa-yin-yang"></i>Yoga</a></li>
        </ul>
    </nav>

    <main>
        <h1 class="page-title">Đăng Ký Tập Luyện</h1>
        
        <form class="register-form" action="#" method="POST">
            <div class="form-group">
                <label for="title">Title:</label>
                <select id="title" name="title" required>
                    <option value="Mr">Mr</option>
                    <option value="Ms">Ms</option>
                    <option value="Mrs">Mrs</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name">Name (Chọn tài khoản khách):</label>
                <select id="name" name="name" required>
                    <option value="khach1">Nguyễn Văn A</option>
                    <option value="khach2">Trần Thị B</option>
                    <option value="khach3">Lê Hoàng C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
            </div>

            <div class="form-group">
                <label for="goal">Training Goal:</label>
                <select id="goal" name="goal" required>
                    <option value="weight_loss">Weight Loss</option>
                    <option value="muscle_gain">Muscle Gain</option>
                    <option value="yoga">Yoga</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duration">Package Duration:</label>
                <select id="duration" name="duration" required>
                    <option value="1_month">1 month</option>
                    <option value="3_months">3 months</option>
                    <option value="6_months">6 months</option>
                </select>
            </div>

            <div class="form-group">
                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" required>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity (Số người tập):</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1" required>
            </div>

            <div class="form-group">
                <label for="note">Note:</label>
                <textarea id="note" name="note" placeholder="Ghi chú thêm..."></textarea>
            </div>

            <button type="submit">Gửi Đăng Ký</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 CMC Fitness & Gym. All rights reserved.</p>
    </footer>

</body>
</html>
